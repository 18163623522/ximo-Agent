# mkosi 主配置 — ximo-OS 0.1（阶段 1）
# 目标：Debian trixie 底座 + nodejs + agent-hostd 开机自启，无 GUI（headless），
# 控制面只有 SSH(22) 与 cockpit-link(17890)。
# 已在 mkosi 25.3（Debian trixie 仓库）验证语法。构建入口见 os/scripts/build-in-wsl.sh

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ImageId=ximo-os
ImageVersion=0.1
# 磁盘镜像（GPT/UEFI）；QEMU/Hyper-V 用，转 VHDX 见 os/README.md
Format=disk
OutputDirectory=out

[Content]
Packages=
    systemd
    systemd-sysv
    dbus
    openssh-server
    linux-image-amd64
    nodejs
    ca-certificates
    curl
    locales
    bash
# 串行控制台 — QEMU TCG -nographic 可见启动与登录提示（无 VT-x 本地方案配套）
KernelCommandLine=console=ttyS0

# 镜像覆盖树 — 主机运行时产物 + systemd 单元 + wants 软链（启用不依赖脚本时序）
# 由 build-in-wsl.sh 归集生成：
#   opt/ximo-host/dist-host/agent-hostd.cjs
#   etc/systemd/system/agent-hostd.service
#   etc/systemd/system/ximo-os-firstboot.service
#   etc/systemd/system/multi-user.target.wants/*（相对软链）
#   usr/local/sbin/ximo-os-firstboot.sh
ExtraTrees=artifacts/image-overlay

[Execution]
PostInstallationScripts=provision/postinstall.sh

[Build]
# 工具树 — CI/任意宿主上自管工具版本（bootctl/ukify/repart 等），
# 不再依赖 runner 预装；首次构建多花约 1-2 分钟
ToolsTree=default
