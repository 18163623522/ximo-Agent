name: ximo-OS 镜像

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'os/**'
      - 'src/host/**'
      - 'tests/host/**'
      - 'scripts/host-build.mjs'
      - 'src/main/Permission.ts'
      - 'src/main/security-guard.ts'
      - 'src/shared/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（跳过 electron 二进制下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 构建主机运行时（agent-hostd.cjs）
        run: npm run host:build

      - name: 安装 mkosi 与 qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pefile systemd-ukify systemd-boot debian-archive-keyring mtools
          # mkosi 25.3 取自 Debian trixie 官方 deb — PyPI 无发布；
          # noble apt 版 24.3 的工具树包清单用旧名（t64 改名后失效）
          curl -fsSL -o /tmp/mkosi.deb http://deb.debian.org/debian/pool/main/m/mkosi/mkosi_25.3-7_all.deb
          # 解包 + 包装脚本 — 自带 PYTHONPATH（sudo 会剥离环境变量），root/普通用户均可见
          sudo dpkg-deb -x /tmp/mkosi.deb /opt/mkosi-253
          printf '#!/bin/sh\nPYTHONPATH=/opt/mkosi-253/usr/lib/python3/dist-packages exec /usr/bin/python3 /opt/mkosi-253/usr/bin/mkosi "$@"\n' | sudo tee /usr/local/bin/mkosi > /dev/null
          sudo chmod +x /usr/local/bin/mkosi
          /usr/local/bin/mkosi --version

      - name: 构建 ximo-OS 0.1 磁盘镜像
        # root 运行 — Ubuntu 24.04 AppArmor 限制非特权 userns，mkosi 无根构建
        # 会报 Operation not permitted / uid 65436 映射失败；root 直建绕过
        run: sudo -E bash os/scripts/build-image.sh

      - name: 注入 CI apiKey（如有 secret）
        # 注意：secrets 上下文不能用于步骤级 if（workflow 启动即报错），
        # 改在 run 块内经 env 判断
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "⚠ 未配置 DEEPSEEK_API_KEY secret — 跳过注入（冒烟降级为 health-only）"
            exit 0
          fi
          # 在覆盖树中预置 config.json（含 CI apiKey）
          # firstboot.sh 的 [ ! -f config.json ] 判断会跳过创建 → 直接用注入的版本
          mkdir -p os/mkosi/artifacts/image-overlay/opt/ximo-host/config
          cat > os/mkosi/artifacts/image-overlay/opt/ximo-host/config/config.json <<EOF
          {
            "listen": "0.0.0.0:17890",
            "baseUrl": "https://api.deepseek.com/v1",
            "apiKey": "$DEEPSEEK_API_KEY",
            "model": "deepseek-chat",
            "mode": "coding",
            "display": ":99"
          }
          EOF
          chmod 600 os/mkosi/artifacts/image-overlay/opt/ximo-host/config/config.json
          # 重建镜像以包含注入的 apiKey
          cd os/mkosi && sudo -E mkosi build

      - name: 引导冒烟（QEMU TCG — 移除 continue-on-error，红灯即 CI 红）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd os/mkosi
          # 串口控制台输出写文件 — 用于提取 agent-hostd 令牌（service 侧需 journal+console）
          # hostfwd 必须同时转发 22 与 17890 — 冒烟探测的是 cockpit-link 端口
          # 必须与构建同样 sudo：AppArmor 限制非特权 userns，mkosi 的沙箱 unshare 会被拒
          sudo -E mkosi qemu --qemu-args "-nic user,model=virtio-net-pci,hostfwd=tcp::12222-:22,hostfwd=tcp::17890-:17890 -serial file:/tmp/serial-console.log" &
          QPID=$!
          # 等 cockpit-link 端口就绪（比 SSH 更说明 agent-hostd 已启动）；TCG 引导 2-5 分钟
          for i in $(seq 1 150); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/17890' 2>/dev/null; then
              echo "✅ cockpit-link 端口就绪 — agent-hostd 已启动"
              break
            fi
            sleep 3
          done
          # 再等几秒让 agent-hostd 打印令牌
          sleep 5
          if ! timeout 2 bash -c '</dev/tcp/127.0.0.1/17890' 2>/dev/null; then
            echo "❌ 450s 内未探测到 cockpit-link 端口"
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          # 从串口控制台日志提取令牌
          TOKEN="$(grep -oP 'token = \K.+' /tmp/serial-console.log | head -1)" || true
          if [ -z "$TOKEN" ]; then
            echo "❌ 未能从串口控制台提取令牌"
            sudo cat /tmp/serial-console.log | tail -50
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          echo "✅ 令牌已提取（长度 ${#TOKEN}）"
          # [3] GET /api/health 返回 200
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:17890/api/health)
          if [ "$HEALTH" != "200" ]; then
            echo "❌ /api/health 返回 $HEALTH（期望 200）"
            sudo pkill -f qemu-system-x86_64 || true
            exit 1
          fi
          echo "✅ /api/health 返回 200"
          # 接入 verify-image.mjs 的完整验收（health/令牌/派任务/审批/桌面在环）
          # 无 DEEPSEEK_API_KEY secret 时任务会失败 — 那时仅 health 通过即冒烟绿
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            node os/scripts/verify-image.mjs --token "$TOKEN" --port 17890 --ssh-port 12222 --require-desktop
            VRC=$?
          else
            echo "⚠ 无 DEEPSEEK_API_KEY secret — 跳过 WS 派任务（health 200 已通过）"
            VRC=0
          fi
          sudo pkill -f qemu-system-x86_64 || true
          exit $VRC

      - name: 上传镜像工件
        uses: actions/upload-artifact@v4
        with:
          name: ximo-os-0.1-raw
          path: os/mkosi/out/*.raw
          retention-days: 7
          # 压缩：raw 是稀疏文件（逻辑 1.2GB / 实占 839MB，约 360MB 空洞），
          # 开压缩后空洞近乎免费（原先 compression-level: 0 按 1.2GB 全量传输）
          compression-level: 6

  xvfb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（跳过 electron 二进制下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 安装 X 桌面栈
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool wmctrl xclip imagemagick openbox xterm

      - name: Xvfb 在环集成测试
        run: |
          # xvfb-run 提供虚拟 X 显示，openbox 作窗口管理器，xterm 提供可驱动窗口
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            openbox &
            sleep 1
            export DISPLAY=$DISPLAY
            npx vitest run tests/host/desktop-bus-xvfb.test.ts
          '